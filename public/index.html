<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloudora</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <script>try{const v=JSON.parse(localStorage.getItem("cloudora:vars")),r=document.documentElement.style;for(const k in v)r.setProperty(k=="color-scheme"?k:"--"+k,v[k])}catch{}</script>
  <link rel="stylesheet" href="style.css" />
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><img src="/logo.png" alt="" />Cloudora</div>
    <button id="new-tab" data-ic="plus">New tab</button>
    <nav id="nav"><button data-page="home">Home</button><button data-page="anime">Anime</button><button data-page="manga">Manga</button></nav>
    <div id="tablist"></div>
    <div class="side-foot"><span id="status">Connecting…</span><button class="ghost" id="open-settings" title="Settings" data-ic="sliders"></button></div>
  </aside>
  <main>
    <form id="bar" autocomplete="off">
      <button type="button" class="ghost" id="toggle" title="Sidebar" data-ic="sidebar"></button>
      <button type="button" class="ghost" id="back" title="Back" data-ic="back"></button>
      <button type="button" class="ghost" id="forward" title="Forward" data-ic="forward"></button>
      <button type="button" class="ghost" id="reload" title="Reload" data-ic="reload"></button>
      <div class="pill glow"><input id="address" placeholder="Search or enter address" spellcheck="false" /></div>
      <button type="button" class="ghost" id="mode-btn" title="Day / night"></button>
      <button type="button" class="ghost" id="star" title="Bookmark" data-ic="star"></button>
    </form>
    <div id="stage">
      <div id="views"></div>
      <section id="home">
        <div class="word">Cloudora</div>
        <div class="tag">Browse beyond the walls.</div>
        <div id="notice" hidden></div>
        <form id="home-form" class="pill glow"><input id="home-q" placeholder="Search the web or type a URL" spellcheck="false" /></form>
        <div class="tiles" id="tiles"></div>
      </section>
      <section id="discover" hidden>
        <header><h2 id="d-title"></h2><form id="d-form" class="pill glow"><input id="d-q" placeholder="Search…" spellcheck="false" /></form></header>
        <div id="d-body"></div>
        <div id="d-detail" hidden></div>
        <div id="reader" hidden></div>
        <div id="player" hidden></div>
      </section>
    </div>
  </main>
  <div id="settings" hidden>
    <div class="card">
      <div class="row"><b>Settings</b><button class="ghost" id="close-settings" data-ic="close"></button></div>
      <h4>Appearance</h4>
      <div class="seg" id="modes"></div>
      <div class="swatches" id="themes"></div>
      <div class="wheelrow">
        <div class="wheelwrap"><div id="wheel"><div id="wthumb"></div></div><div id="wprev"></div></div>
        <div class="wctl">
          <small>Custom color</small>
          <input type="range" id="wsat" min="30" max="100" title="Intensity" />
          <div class="row"><span class="chip" id="whex">#000000</span><input type="color" id="wnative" title="Pick exact color" /></div>
        </div>
      </div>
      <div class="set"><div><b>Cursor glow</b><small>Search bars and cards light up near your cursor</small></div><button class="switch" data-k="glow" role="switch"></button></div>
      <h4>Search</h4>
      <div class="set"><b>Search engine</b><select id="engine"></select></div>
      <h4>Privacy</h4>
      <div class="set"><div><b>Block ads &amp; trackers</b><small>Blocks common ad networks and hides ad boxes</small></div><button class="switch" data-k="adblock" role="switch"></button></div>
      <div class="set"><b>Bookmarks</b><button class="btn" id="clear-bm">Clear</button></div>
      <small class="foot">Cloudora 0.4</small>
    </div>
  </div>
</div>
</body>
</html>
