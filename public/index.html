<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skyhop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%237aa2ff'/%3E%3Cpath d='M5 16c3-9 11-9 14 0' stroke='%230a0a0c' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("skyhop:theme"))||"midnight"}catch{}</script>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 17c3.5-10 12.5-10 16 0"/><circle cx="12" cy="6.5" r="1.6" fill="currentColor"/></svg>Skyhop</div>
    <button id="new-tab" data-ic="plus">New tab</button>
    <div id="tablist"></div>
    <div class="side-foot"><span id="status">Connecting…</span><button class="ghost" id="open-settings" title="Settings" data-ic="sliders"></button></div>
  </aside>
  <main>
    <form id="bar" autocomplete="off">
      <button type="button" class="ghost" id="toggle" title="Sidebar" data-ic="sidebar"></button>
      <button type="button" class="ghost" id="back" title="Back" data-ic="back"></button>
      <button type="button" class="ghost" id="forward" title="Forward" data-ic="forward"></button>
      <button type="button" class="ghost" id="reload" title="Reload" data-ic="reload"></button>
      <input id="address" placeholder="Search or enter address" spellcheck="false" />
      <button type="button" class="ghost" id="star" title="Bookmark" data-ic="star"></button>
    </form>
    <div id="stage">
      <div id="views"></div>
      <section id="home">
        <div class="word">Skyhop</div>
        <div class="tag">Hop past the walls.</div>
        <div id="notice" hidden></div>
        <form id="home-form"><input id="home-q" placeholder="Search the web or type a URL" spellcheck="false" /></form>
        <div class="tiles" id="tiles"></div>
      </section>
    </div>
  </main>
  <div id="settings" hidden>
    <div class="card">
      <div class="row"><b>Settings</b><button class="ghost" id="close-settings" data-ic="close"></button></div>
      <label>Theme</label><div id="themes" class="swatches"></div>
      <label for="engine">Search engine</label><select id="engine"></select>
    </div>
  </div>
</div>
</body>
</html>
